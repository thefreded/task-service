name: Build and Package Task Service

on:
  push:
    branches:
      - '**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Use custom Maven settings.xml with GitHub credentials
        run: |
          mkdir -p ~/.m2
          cp ./.github/settings/maven-settings.xml ~/.m2/settings.xml
          sed -i "s/\${env.GITHUB_ACTOR}/${{ github.actor }}/g" ~/.m2/settings.xml
          sed -i "s/\${env.GITHUB_TOKEN}/${{ secrets.GITHUB_TOKEN }}/g" ~/.m2/settings.xml
          cat ~/.m2/settings.xml

      - name: Build (install) artifacts locally
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn install -pl client,server -am -DskipTests -U --settings ~/.m2/settings.xml

      - name: Deploy to GitHub Packages (client and server)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn deploy -pl client,server -am -DskipTests -U --settings ~/.m2/settings.xml

      - name: Create Docker build context directory
        run: |
          mkdir -p docker-build/
          cp -r server/target/quarkus-app/* docker-build/
          ls -la docker-build/

      - name: List server target directory (for debugging, remove later)
        run: ls -la server/target/quarkus-app/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump from all commits in PR merge
        id: determine_bump
        run: |
          COMMITS=$(git log ${{ github.event.before }}..${{ github.sha }} --pretty=format:"%s")
          echo "Analyzing commit messages:"
          echo "$COMMITS"

          bump="none"

          if echo "$COMMITS" | grep -qE "^feat!:"; then
            bump="major"
          elif echo "$COMMITS" | grep -qE "^feat:"; then
            bump="minor"
          elif echo "$COMMITS" | grep -qE "^chore:" || echo "$COMMITS" | grep -qE "^fix:"; then
            bump="patch"
          fi

          echo "Determined bump level: $bump"
          echo "bump=$bump" >> $GITHUB_OUTPUT

      - name: Bump version in version tags
        id: bump_version
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-utils

          CURRENT_VERSION=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          echo "Current version: $CURRENT_VERSION"

          if [[ -z "$CURRENT_VERSION" ]]; then echo "ERROR: CURRENT_VERSION is empty"; exit 1; fi

          CLEAN_VERSION=$(echo "$CURRENT_VERSION" | sed 's/[^0-9.].*$//')
          echo "Clean version for parsing: $CLEAN_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          BUMP=${{ steps.determine_bump.outputs.bump }}

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update root <version>
          sed -i "0,/<version>$CURRENT_VERSION<\/version>/s//<version>$NEW_VERSION<\/version>/" pom.xml

          # Update <parent><version> in module POMs
          for module in client server; do
            sed -i "0,/<version>$CURRENT_VERSION<\/version>/s//<version>$NEW_VERSION<\/version>/" "$module/pom.xml"
          done

      - name: Build and Push Docker Image (server module)
        uses: docker/build-push-action@v6
        with:
          context: ./docker-build
          file: ./server/Dockerfile
          push: true
          tags: |
            workfred/task-server:${{ steps.bump_version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/task-server:${{ steps.bump_version.outputs.version }}
            workfred/task-server:latest
            ghcr.io/${{ github.repository_owner }}/task-server:latest
          platforms: linux/amd64

      - name: Commit and Push Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pom.xml client/pom.xml server/pom.xml
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.version }}" || echo "No changes to commit"
          git push
