name: Build and Package Task Service

on:
  push:
    branches:
      - '**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Use custom Maven settings.xml with GitHub credentials
        run: |
          mkdir -p ~/.m2
          cp ./.github/settings/maven-settings.xml ~/.m2/settings.xml
          sed -i "s/\${env.GITHUB_ACTOR}/${{ github.actor }}/g" ~/.m2/settings.xml
          sed -i "s/\${env.GITHUB_TOKEN}/${{ secrets.GITHUB_TOKEN }}/g" ~/.m2/settings.xml
          cat ~/.m2/settings.xml

      - name: Build (install) artifacts locally
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn install -pl client,server -am -DskipTests -U --settings ~/.m2/settings.xml

      - name: Deploy to GitHub Packages (client and server)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn deploy -pl client,server -am -DskipTests -U --settings ~/.m2/settings.xml

      - name: Create Docker build context directory
        run: |
          mkdir -p docker-build/
          cp -r server/target/quarkus-app/* docker-build/
          ls -la docker-build/

      - name: List server target directory (for debugging, remove later)
        run: ls -la server/target/quarkus-app/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image (server module)
        uses: docker/build-push-action@v6
        with:
          context: ./docker-build
          file: ./server/Dockerfile
          push: true
          tags: |
            workfred/task-server:latest
            ghcr.io/${{ github.repository_owner }}/task-server:latest
          platforms: linux/amd64